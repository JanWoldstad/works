name: Wild number Python and C++ checks

on:
  push:
    paths: &check_paths
      - 'wild-number-13-14/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths: *check_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wild-number-13-14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run all Python and C++ checks
        run: python3 verify.py --with-cpp
